<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebook RAG</title>
<link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<header>
  <div class="brand">📚 <span>Ebook RAG</span></div>
  <nav>
    <button class="tab active" data-view="ask">Ask</button>
    <button class="tab" data-view="library">Library <span id="book-count" class="pill">0</span></button>
    <button class="tab" data-view="explore">Explore</button>
  </nav>
  <div id="health" class="health" title="Ollama status">●</div>
</header>

<main>
  <!-- ASK -->
  <section id="view-ask" class="view active">
    <div id="chat" class="chat">
      <div class="empty" id="chat-empty">
        <div class="avatar big">AI</div>
        <h2>What do you want to learn today?</h2>
        <p>Answers come from <b id="lib-size">your books</b>, with citations, written by <b id="llm-name">llama3</b> running locally.</p>
        <div class="suggestions">
          <button>What are the SOLID principles? Give an example of each.</button>
          <button>When should I prefer composition over inheritance?</button>
          <button>How do I design an idempotent API?</button>
        </div>
      </div>
    </div>
    <form id="ask-form" class="composer">
      <textarea id="question" rows="1" placeholder="Message your bookshelf… (Shift+Enter for a new line)"></textarea>
      <div class="composer-bar">
        <span class="spacer"></span>
        <button type="button" id="clear" class="ghost" title="Start a new conversation">New chat</button>
        <button type="submit" id="send" title="Send">↑</button>
      </div>
    </form>
  </section>

  <!-- LIBRARY -->
  <section id="view-library" class="view">
    <label id="dropzone" class="dropzone">
      <input id="file-input" type="file" multiple accept=".pdf,.epub,.txt,.md" hidden>
      <div class="dz-icon">⬆</div>
      <div><b>Drop ebooks here</b> or click to browse</div>
      <div class="muted">PDF, EPUB, TXT, MD · indexed locally into ChromaDB</div>
    </label>
    <div id="books" class="books"></div>
  </section>

  <!-- EXPLORE: read-only view of everything in the Chroma index -->
  <section id="view-explore" class="view">
    <div id="ix-stats" class="ix-stats"></div>
    <div class="ix-modes">
      <button class="ix-mode on" data-mode="passages">Passages</button>
      <button class="ix-mode" data-mode="tables">Database tables</button>
    </div>
    <div id="ix-passages" class="ix-layout">
      <aside class="ix-books">
        <input id="ix-book-filter" type="search" placeholder="Filter books…" autocomplete="off">
        <div id="ix-book-list" class="ix-book-list"></div>
      </aside>
      <div class="ix-main">
        <div class="ix-head">
          <div>
            <div id="ix-title" class="ix-title">All books</div>
            <div id="ix-sub" class="muted"></div>
          </div>
          <form id="ix-search-form" class="ix-search">
            <input id="ix-search" type="search" placeholder="Find text in passages…" autocomplete="off">
          </form>
        </div>
        <div id="ix-chunks" class="ix-chunks"></div>
        <button id="ix-more" class="ix-more" hidden>Load more</button>
      </div>
    </div>
    <div id="ix-tables" class="ix-layout" hidden>
      <aside class="ix-books">
        <div class="muted">chroma.sqlite3 (read-only)</div>
        <div id="db-table-list" class="ix-book-list"></div>
      </aside>
      <div class="ix-main">
        <div class="ix-head">
          <div>
            <div id="db-title" class="ix-title"></div>
            <div id="db-sub" class="muted"></div>
          </div>
          <div class="db-pager">
            <button id="db-prev" class="ix-more">‹ Prev</button>
            <button id="db-next" class="ix-more">Next ›</button>
          </div>
        </div>
        <div class="db-grid-wrap"><table id="db-grid" class="db-grid"></table></div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="/static/app.js?v=5"></script>
</body>
</html>
